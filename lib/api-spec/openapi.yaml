openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SkillBridge learning platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Learner dashboard and activity
  - name: courses
    description: Course discovery and learning progress
  - name: mentors
    description: Expert mentors and sessions
  - name: profile
    description: Learner profile
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get learner dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Get recent learner activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List courses
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
      responses:
        "200":
          description: Course library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get a course
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Course not found
    post:
      operationId: enrollInCourse
      tags: [courses]
      summary: Enroll in a course
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentInput"
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "404":
          description: Course not found
  /courses/{courseId}/progress:
    patch:
      operationId: updateCourseProgress
      tags: [courses]
      summary: Update course progress
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressInput"
      responses:
        "200":
          description: Updated enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"
        "404":
          description: Enrollment not found
  /mentors:
    get:
      operationId: listMentors
      tags: [mentors]
      summary: List mentors
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: expertise
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Mentor directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mentor"
  /mentor-sessions:
    post:
      operationId: createMentorSession
      tags: [mentors]
      summary: Book a mentor session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorSessionInput"
      responses:
        "201":
          description: Session booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorSession"
        "404":
          description: Mentor not found
    get:
      operationId: listMentorSessions
      tags: [mentors]
      summary: List booked mentor sessions
      responses:
        "200":
          description: Booked sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MentorSession"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get learner profile
      responses:
        "200":
          description: Learner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update learner profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Course:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        category: { type: string }
        level:
          type: string
          enum: [beginner, intermediate, advanced]
        description: { type: string }
        instructor: { type: string }
        instructorRole: { type: string }
        durationMinutes: { type: integer }
        lessonsCount: { type: integer }
        rating: { type: number }
        studentsCount: { type: integer }
        accent: { type: string }
        isFeatured: { type: boolean }
        progress:
          type: ["integer", "null"]
        enrolled:
          type: boolean
      required:
        - id
        - title
        - slug
        - category
        - level
        - description
        - instructor
        - instructorRole
        - durationMinutes
        - lessonsCount
        - rating
        - studentsCount
        - accent
        - isFeatured
        - progress
        - enrolled
    Lesson:
      type: object
      properties:
        id: { type: integer }
        courseId: { type: integer }
        title: { type: string }
        durationMinutes: { type: integer }
        position: { type: integer }
        completed: { type: boolean }
        type: { type: string }
      required: [id, courseId, title, durationMinutes, position, completed, type]
    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          properties:
            lessons:
              type: array
              items:
                $ref: "#/components/schemas/Lesson"
          required: [lessons]
    EnrollmentInput:
      type: object
      properties:
        source:
          type: string
          default: discovery
    Enrollment:
      type: object
      properties:
        id: { type: integer }
        courseId: { type: integer }
        progress: { type: integer }
        completedLessons: { type: integer }
        enrolledAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
      required: [id, courseId, progress, completedLessons, enrolledAt, lastActivityAt]
    ProgressInput:
      type: object
      properties:
        progress: { type: integer, minimum: 0, maximum: 100 }
        completedLessons: { type: integer, minimum: 0 }
      required: [progress, completedLessons]
    Activity:
      type: object
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
        accent: { type: string }
      required: [id, type, title, description, occurredAt, accent]
    WeeklyActivity:
      type: object
      properties:
        day: { type: string }
        hours: { type: number }
      required: [day, hours]
    Dashboard:
      type: object
      properties:
        greeting: { type: string }
        activeCourses: { type: integer }
        completedLessons: { type: integer }
        learningHours: { type: number }
        currentStreak: { type: integer }
        weeklyActivity:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyActivity"
        continueLearning:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        nextSession:
          type: ["string", "null"]
      required:
        - greeting
        - activeCourses
        - completedLessons
        - learningHours
        - currentStreak
        - weeklyActivity
        - continueLearning
        - recentActivity
        - nextSession
    Mentor:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        company: { type: string }
        bio: { type: string }
        expertise:
          type: array
          items: { type: string }
        rating: { type: number }
        reviewCount: { type: integer }
        sessionPrice: { type: integer }
        availability: { type: string }
        accent: { type: string }
      required:
        - id
        - name
        - role
        - company
        - bio
        - expertise
        - rating
        - reviewCount
        - sessionPrice
        - availability
        - accent
    MentorSessionInput:
      type: object
      properties:
        mentorId: { type: integer }
        scheduledAt: { type: string, format: date-time }
        topic: { type: string, minLength: 1 }
      required: [mentorId, scheduledAt, topic]
    MentorSession:
      type: object
      properties:
        id: { type: integer }
        mentorId: { type: integer }
        mentorName: { type: string }
        scheduledAt: { type: string, format: date-time }
        topic: { type: string }
        status:
          type: string
          enum: [scheduled, completed, cancelled]
      required: [id, mentorId, mentorName, scheduledAt, topic, status]
    Profile:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        bio: { type: string }
        skills:
          type: array
          items: { type: string }
        weeklyGoalHours: { type: integer }
        timezone: { type: string }
      required: [id, name, email, role, bio, skills, weeklyGoalHours, timezone]
    ProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        bio: { type: string }
        skills:
          type: array
          items: { type: string }
        weeklyGoalHours: { type: integer, minimum: 1, maximum: 40 }
        timezone: { type: string }